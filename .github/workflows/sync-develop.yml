name: Sync develop with main

# Cada vez que main avanza (normalmente al mergear una PR de develop),
# este workflow trae esos commits de vuelta a develop para que nunca se
# quede "por detrás" de main. Si hay conflictos, abre una PR en lugar de
# hacer push directo.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-develop:
    name: Merge main into develop
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Try fast-forward/merge main into develop
        id: merge
        run: |
          git fetch origin main
          if git merge origin/main --no-edit; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push develop
        if: steps.merge.outputs.conflict == 'false'
        run: git push origin develop

      - name: Open PR when there are conflicts
        if: steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="sync/main-to-develop-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git push origin "$BRANCH"
          gh pr create \
            --base develop \
            --head "$BRANCH" \
            --title "Sync develop with main (conflictos manuales)" \
            --body "main avanzó y develop no pudo actualizarse automáticamente por conflictos. Resuelve el merge en esta PR."
